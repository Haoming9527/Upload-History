name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run zip
      - name: Verify extension packages exist
        run: ls -lh .output/*.zip
      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: upload-history-packages
          path: .output/*.zip
          # WXT writes packages inside a dot-prefixed directory.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-history-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
