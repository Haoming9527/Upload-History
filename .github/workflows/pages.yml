name: Publish website

on:
  push:
    branches: [main]
    paths:
      - public/privacy.html
      - public/icon/128.png
      - site/**
      - scripts/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - name: Build website and privacy page
        run: node scripts/site/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .output/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public home page without authentication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors --max-time 20 \
            "${PAGE_URL%/}/" -o /tmp/home.html
          grep -Fq 'Upload History' /tmp/home.html
          grep -Fq 'privacy.html' /tmp/home.html
      - name: Verify public privacy policy without authentication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors --max-time 20 \
            "${PAGE_URL%/}/privacy.html" -o /tmp/privacy.html
          grep -Fq '<h1>Upload History privacy policy</h1>' /tmp/privacy.html
