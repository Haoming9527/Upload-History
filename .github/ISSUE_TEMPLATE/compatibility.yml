name: Upload compatibility
description: Report a file control that is not recorded as expected.
title: '[Compatibility] '
body:
  - type: markdown
    attributes:
      value: |
        Use harmless test files. Do not attach real assignments, credentials, private URLs, or browser profiles. For a vulnerability, follow SECURITY.md instead.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Chrome version, extension version, and operating system.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and upload method
      description: For example, a local file input, file drag and drop, or cloud-document picker. Remove private URL details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and observed result
      description: Explain the steps, recording mode, permission state, expected behavior, and displayed status. Link a public synthetic example if available.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no private files, credentials, or browser-profile data.
          required: true
